<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App — ezAuth Example</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1a1a1a;
  --muted: #666666;
  --border: #eeeeee;
  --accent: #000000;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* Auth pages */
.auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #fff; }
.auth-card { background: #fff; padding: 60px; width: 400px; border: 1px solid var(--border); }
.auth-card h1 { font-size: 28px; font-weight: 300; margin-bottom: 8px; text-align: center; letter-spacing: -0.02em; }
.auth-card p.subtitle { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 40px; }
.auth-card label { display: block; font-weight: 600; font-size: 11px; margin-bottom: 8px; margin-top: 24px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.auth-card label:first-of-type { margin-top: 0; }
.auth-card input { width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid var(--border); font-size: 14px; background: transparent; transition: border-color 0.2s; border-radius: 0; }
.auth-card input:focus { outline: none; border-color: var(--accent); }
.auth-card button { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 32px; text-transform: uppercase; letter-spacing: 0.05em; transition: opacity 0.2s; }
.auth-card button:hover { opacity: 0.8; }
.auth-card button:disabled { opacity: 0.4; cursor: not-allowed; }
.auth-card .switch { text-align: center; margin-top: 24px; font-size: 13px; color: var(--muted); }
.auth-card .switch a { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: 600; }
.error { color: #000; font-size: 13px; margin-top: 12px; border-left: 2px solid #000; padding-left: 12px; }
.info { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: center; }

/* App shell */
.app-header { background: #fff; padding: 32px 40px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.app-header h1 { font-size: 22px; font-weight: 300; color: #000; letter-spacing: -0.02em; }
.app-header .user-info { display: flex; align-items: center; gap: 24px; font-size: 13px; color: var(--muted); }
.app-header .user-info button { padding: 0; font-size: 12px; width: auto; margin: 0; background: transparent; color: var(--accent); border: none; text-decoration: underline; cursor: pointer; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

/* Todo list */
.todo-container { max-width: 600px; margin: 80px auto; padding: 0 24px; }
.add-form { display: flex; gap: 24px; margin-bottom: 60px; border-bottom: 1px solid var(--border); }
.add-form input { flex: 1; padding: 16px 0; border: none; font-size: 18px; background: transparent; font-weight: 300; }
.add-form input:focus { outline: none; }
.add-form button { padding: 16px 0; background: transparent; color: var(--accent); border: none; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; width: auto; margin: 0; text-transform: uppercase; letter-spacing: 0.1em; }

.todo-list { list-style: none; }
.todo-item { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); transition: opacity 0.2s; }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
.todo-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #000; flex-shrink: 0; border: 1px solid var(--border); }
.todo-text { flex: 1; font-size: 16px; word-break: break-word; color: #333; }
.todo-delete { background: none; border: none; color: var(--border); cursor: pointer; font-size: 20px; padding: 4px; line-height: 1; transition: color 0.2s; }
.todo-delete:hover { color: #000; }
.empty { text-align: center; color: var(--muted); padding: 60px; font-size: 15px; font-weight: 300; }
.loading { text-align: center; padding: 60px; color: var(--muted); font-size: 15px; }
.powered-by { text-align: center; margin-top: 100px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.powered-by a { color: var(--accent); text-decoration: none; font-weight: 600; }
.hidden { display: none; }

/* Files */
.files-section { margin-top: 100px; }
.files-section h2 { font-size: 14px; font-weight: 600; margin-bottom: 32px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.upload-form { display: flex; gap: 24px; margin-bottom: 32px; align-items: baseline; }
.upload-form label.file-btn { color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; text-decoration: underline; }
.upload-form .file-name { font-size: 12px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upload-form button { padding: 8px 16px; background: var(--accent); color: #fff; border: none; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
.upload-form button:disabled { opacity: 0.2; }
.file-list { list-style: none; }
.file-item { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.file-item .file-icon { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; opacity: 0.5; }
.file-item .file-info { flex: 1; min-width: 0; }
.file-item .file-info .name { font-size: 14px; font-weight: 400; color: #333; }
.file-item .file-info .meta { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
.file-item a { color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: underline; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; }
.file-item .file-delete { background: none; border: none; color: var(--border); cursor: pointer; font-size: 20px; padding: 4px; line-height: 1; }
.file-item .file-delete:hover { color: #000; }
.upload-progress { font-size: 12px; color: var(--accent); margin-bottom: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div id="app"></div>

<script src="/dashboard/ezauth.iife.js"></script>
<script>
(function() {
  'use strict';

  const API_URL = 'https://api.ezauth.org';
  const PK = 'pk_test_D-_PoRhJddfRvs7Gfjc1TBv-Bfh1ubpy';
  const TODOS_TABLE = 'todos';
  const FILES_BUCKET = 'files';

  const $ = (sel) => document.querySelector(sel);
  const app = () => $('#app');

  let ez = null;
  let user = null;
  let todosTableId = null;
  let filesBucketId = null;

  // ── Session ──

  function getSession() {
    const s = sessionStorage.getItem('todo_session');
    return s ? JSON.parse(s) : null;
  }

  function saveSession(data) {
    sessionStorage.setItem('todo_session', JSON.stringify(data));
  }

  function clearSession() {
    sessionStorage.removeItem('todo_session');
    ez = null;
    user = null;
    renderLogin();
  }

  function initClient(accessToken) {
    ez = new EZAuth.EZAuth({ baseUrl: API_URL, publishableKey: PK, accessToken });
  }

  // ── Router ──

  async function boot() {
    const session = getSession();
    if (!session) { renderLogin(); return; }
    initClient(session.access_token);
    user = { email: session.email, user_id: session.user_id };
    renderApp();
    await Promise.all([loadTodos(), loadFiles()]);
  }

  // ── Auth: Login ──

  function renderLogin() {
    app().innerHTML = `
      <div class="auth-page">
        <div class="auth-card">
          <h1>Todo App</h1>
          <p class="subtitle">Sign in with a magic code</p>
          <p id="auth-error" class="error hidden"></p>
          <div id="email-step">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autofocus>
            <button id="send-btn">Send Code</button>
          </div>
          <div id="code-step" class="hidden">
            <p class="info">Check your email for a 6-digit code.</p>
            <label for="code">Code</label>
            <input type="text" id="code" placeholder="123456" maxlength="6" inputmode="numeric">
            <button id="verify-btn">Verify</button>
            <p style="text-align:center;margin-top:12px;"><a id="back-link" style="color:#667eea;cursor:pointer;font-size:13px;">Back</a></p>
          </div>
          <div class="switch">Don't have an account? <a id="go-signup">Sign up</a></div>
        </div>
      </div>
    `;
    $('#send-btn').onclick = sendLoginCode;
    $('#email').onkeydown = e => { if (e.key === 'Enter') sendLoginCode(); };
    $('#verify-btn').onclick = verifyLoginCode;
    $('#code').onkeydown = e => { if (e.key === 'Enter') verifyLoginCode(); };
    $('#back-link').onclick = () => { $('#email-step').classList.remove('hidden'); $('#code-step').classList.add('hidden'); $('#auth-error').classList.add('hidden'); };
    $('#go-signup').onclick = renderSignup;
  }

  async function sendLoginCode() {
    const email = $('#email').value.trim();
    const err = $('#auth-error');
    const btn = $('#send-btn');
    if (!email) { err.textContent = 'Enter your email.'; err.classList.remove('hidden'); return; }
    btn.disabled = true; btn.textContent = 'Sending...'; err.classList.add('hidden');
    try {
      const tmp = new EZAuth.EZAuth({ baseUrl: API_URL, publishableKey: PK });
      await tmp.auth.signIn({ email, strategy: 'magic_link' });
      $('#email-step').classList.add('hidden');
      $('#code-step').classList.remove('hidden');
      $('#code').focus();
    } catch (e) {
      err.textContent = e.message || 'Failed to send code'; err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Send Code'; }
  }

  async function verifyLoginCode() {
    const email = $('#email').value.trim();
    const code = $('#code').value.trim();
    const err = $('#auth-error');
    const btn = $('#verify-btn');
    if (!code) { err.textContent = 'Enter the code.'; err.classList.remove('hidden'); return; }
    btn.disabled = true; btn.textContent = 'Verifying...'; err.classList.add('hidden');
    try {
      const tmp = new EZAuth.EZAuth({ baseUrl: API_URL, publishableKey: PK });
      const res = await tmp.auth.verifyCode({ email, code });
      saveSession({ access_token: res.access_token, refresh_token: res.refresh_token, email, user_id: res.user_id });
      initClient(res.access_token);
      user = { email, user_id: res.user_id };
      renderApp();
      await Promise.all([loadTodos(), loadFiles()]);
    } catch (e) {
      err.textContent = e.message || 'Invalid code'; err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Verify'; }
  }

  // ── Auth: Signup ──

  function renderSignup() {
    app().innerHTML = `
      <div class="auth-page">
        <div class="auth-card">
          <h1>Todo App</h1>
          <p class="subtitle">Create an account</p>
          <p id="auth-error" class="error hidden"></p>
          <div id="email-step">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autofocus>
            <button id="signup-btn">Sign Up</button>
          </div>
          <div id="code-step" class="hidden">
            <p class="info">Check your email for a verification code.</p>
            <label for="code">Code</label>
            <input type="text" id="code" placeholder="123456" maxlength="6" inputmode="numeric">
            <button id="verify-btn">Verify</button>
            <p style="text-align:center;margin-top:12px;"><a id="back-link" style="color:#667eea;cursor:pointer;font-size:13px;">Back</a></p>
          </div>
          <div class="switch">Already have an account? <a id="go-login">Sign in</a></div>
        </div>
      </div>
    `;
    $('#signup-btn').onclick = doSignup;
    $('#email').onkeydown = e => { if (e.key === 'Enter') doSignup(); };
    $('#verify-btn').onclick = verifySignupCode;
    $('#code').onkeydown = e => { if (e.key === 'Enter') verifySignupCode(); };
    $('#back-link').onclick = () => { $('#email-step').classList.remove('hidden'); $('#code-step').classList.add('hidden'); $('#auth-error').classList.add('hidden'); };
    $('#go-login').onclick = renderLogin;
  }

  async function doSignup() {
    const email = $('#email').value.trim();
    const err = $('#auth-error');
    const btn = $('#signup-btn');
    if (!email) { err.textContent = 'Enter your email.'; err.classList.remove('hidden'); return; }
    btn.disabled = true; btn.textContent = 'Signing up...'; err.classList.add('hidden');
    try {
      const tmp = new EZAuth.EZAuth({ baseUrl: API_URL, publishableKey: PK });
      await tmp.auth.signUp({ email });
      $('#email-step').classList.add('hidden');
      $('#code-step').classList.remove('hidden');
      $('#code').focus();
    } catch (e) {
      err.textContent = e.message || 'Signup failed'; err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Sign Up'; }
  }

  async function verifySignupCode() {
    const email = $('#email').value.trim();
    const code = $('#code').value.trim();
    const err = $('#auth-error');
    const btn = $('#verify-btn');
    if (!code) { err.textContent = 'Enter the code.'; err.classList.remove('hidden'); return; }
    btn.disabled = true; btn.textContent = 'Verifying...'; err.classList.add('hidden');
    try {
      const tmp = new EZAuth.EZAuth({ baseUrl: API_URL, publishableKey: PK });
      const res = await tmp.auth.verifyCode({ email, code });
      saveSession({ access_token: res.access_token, refresh_token: res.refresh_token, email, user_id: res.user_id });
      initClient(res.access_token);
      user = { email, user_id: res.user_id };
      renderApp();
      await Promise.all([loadTodos(), loadFiles()]);
    } catch (e) {
      err.textContent = e.message || 'Invalid code'; err.classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Verify'; }
  }

  // ── App Shell ──

  function renderApp() {
    app().innerHTML = `
      <div class="app-header">
        <h1>Todos</h1>
        <div class="user-info">
          <span>${esc(user.email)}</span>
          <button id="logout-btn">Sign out</button>
        </div>
      </div>
      <div class="todo-container">
        <div class="add-form">
          <input type="text" id="new-todo" placeholder="What needs to be done?" autofocus>
          <button id="add-btn">Add</button>
        </div>
        <ul class="todo-list" id="todo-list">
          <li class="loading">Loading...</li>
        </ul>
        <div class="files-section">
          <h2>Files</h2>
          <div class="upload-form">
            <label class="file-btn" for="file-input">Choose File</label>
            <input type="file" id="file-input" style="display:none">
            <span class="file-name" id="file-name">No file selected</span>
            <button id="upload-btn" disabled>Upload</button>
          </div>
          <p id="upload-status" class="upload-progress hidden"></p>
          <ul class="file-list" id="file-list">
            <li class="loading">Loading...</li>
          </ul>
        </div>
        <p class="powered-by">Powered by <a href="https://ezauth.org" target="_blank">ezAuth</a></p>
      </div>
    `;
    $('#logout-btn').onclick = clearSession;
    $('#add-btn').onclick = addTodo;
    $('#new-todo').onkeydown = e => { if (e.key === 'Enter') addTodo(); };
    $('#file-input').onchange = () => {
      const file = $('#file-input').files[0];
      $('#file-name').textContent = file ? file.name : 'No file selected';
      $('#upload-btn').disabled = !file;
    };
    $('#upload-btn').onclick = uploadFile;
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ── Todos ──

  async function resolveTodosTable() {
    if (todosTableId) return todosTableId;
    const res = await ez.tables.list();
    const tables = res.tables || res || [];
    const t = tables.find(t => t.name === TODOS_TABLE);
    if (t) { todosTableId = t.id; return todosTableId; }
    return null;
  }

  async function loadTodos() {
    const list = $('#todo-list');
    try {
      const tableId = await resolveTodosTable();
      if (!tableId) { list.innerHTML = '<li class="empty">No todos yet. Add one above!</li>'; return; }
      const res = await ez.tables.rows.query(tableId, { sort: { field: 'created_at', dir: 'desc' }, limit: 100 });
      const rows = res.rows || [];
      if (rows.length === 0) { list.innerHTML = '<li class="empty">No todos yet. Add one above!</li>'; return; }
      list.innerHTML = rows.map(r => todoHTML(r)).join('');
      bindTodoEvents();
    } catch (e) {
      list.innerHTML = `<li class="empty" style="color:#dc3545;">Failed to load: ${esc(e.message)}</li>`;
    }
  }

  function todoHTML(row) {
    const d = row.data || {};
    const done = d.done === true || d.done === 'true';
    return `<li class="todo-item ${done ? 'done' : ''}" data-id="${esc(row.id)}">
      <input type="checkbox" ${done ? 'checked' : ''}>
      <span class="todo-text">${esc(d.text || '')}</span>
      <button class="todo-delete">&times;</button>
    </li>`;
  }

  function bindTodoEvents() {
    document.querySelectorAll('.todo-item input[type="checkbox"]').forEach(cb => {
      cb.onchange = () => toggleTodo(cb.closest('.todo-item').dataset.id, cb.checked);
    });
    document.querySelectorAll('.todo-delete').forEach(btn => {
      btn.onclick = () => deleteTodo(btn.closest('.todo-item').dataset.id);
    });
  }

  async function addTodo() {
    const input = $('#new-todo');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      let tableId = await resolveTodosTable();
      if (!tableId) {
        // Table doesn't exist yet — this will fail for non-admin users.
        // The table should be pre-created by the app admin.
        const list = $('#todo-list');
        list.innerHTML = '<li class="empty" style="color:#dc3545;">Todos table not found. Please contact the app admin.</li>';
        return;
      }
      await ez.tables.rows.insert(tableId, { data: { text, done: false } });
      await loadTodos();
    } catch (e) {
      alert('Failed to add todo: ' + e.message);
    }
  }

  async function toggleTodo(rowId, done) {
    try {
      await ez.tables.rows.update(todosTableId, rowId, { data: { done } });
      await loadTodos();
    } catch (e) { alert('Failed to update: ' + e.message); }
  }

  async function deleteTodo(rowId) {
    const item = document.querySelector(`.todo-item[data-id="${rowId}"]`);
    if (item) item.style.opacity = '0.4';
    try {
      await ez.tables.rows.delete(todosTableId, rowId);
      await loadTodos();
    } catch (e) { alert('Failed to delete: ' + e.message); }
  }

  // ── Files ──

  async function resolveFilesBucket() {
    if (filesBucketId) return filesBucketId;
    const res = await ez.buckets.list();
    const buckets = res.buckets || res || [];
    const b = buckets.find(b => b.name === FILES_BUCKET);
    if (b) { filesBucketId = b.id; return filesBucketId; }
    return null;
  }

  async function loadFiles() {
    const list = $('#file-list');
    if (!list) return;
    try {
      const bucketId = await resolveFilesBucket();
      if (!bucketId) { list.innerHTML = '<li class="empty">No files yet.</li>'; return; }
      const res = await ez.buckets.objects.list(bucketId, { limit: 50 });
      const objects = res.objects || [];
      if (objects.length === 0) { list.innerHTML = '<li class="empty">No files yet. Upload one above!</li>'; return; }
      list.innerHTML = objects.map(o => fileHTML(o)).join('');
      bindFileEvents();
    } catch (e) {
      list.innerHTML = `<li class="empty" style="color:#dc3545;">Failed to load files: ${esc(e.message)}</li>`;
    }
  }

  function fileIcon(contentType) {
    if (!contentType) return '\u{1F4C4}';
    if (contentType.startsWith('image/')) return '\u{1F5BC}';
    if (contentType.startsWith('video/')) return '\u{1F3AC}';
    if (contentType.startsWith('audio/')) return '\u{1F3B5}';
    if (contentType.includes('pdf')) return '\u{1F4D1}';
    if (contentType.includes('zip') || contentType.includes('tar') || contentType.includes('gzip')) return '\u{1F4E6}';
    return '\u{1F4C4}';
  }

  function formatSize(bytes) {
    if (bytes == null) return '';
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + units[i];
  }

  function fileHTML(obj) {
    return `<li class="file-item" data-key="${esc(obj.key)}">
      <span class="file-icon">${fileIcon(obj.content_type)}</span>
      <div class="file-info">
        <div class="name">${esc(obj.key)}</div>
        <div class="meta">${formatSize(obj.size_bytes || obj.size)} &middot; ${esc(obj.content_type || '')}</div>
      </div>
      <a class="file-download">Download</a>
      <button class="file-delete">&times;</button>
    </li>`;
  }

  function bindFileEvents() {
    document.querySelectorAll('.file-download').forEach(a => {
      a.onclick = () => downloadFile(a.closest('.file-item').dataset.key);
    });
    document.querySelectorAll('.file-delete').forEach(btn => {
      btn.onclick = () => deleteFile(btn.closest('.file-item').dataset.key);
    });
  }

  async function uploadFile() {
    const input = $('#file-input');
    const file = input.files[0];
    if (!file) return;
    const btn = $('#upload-btn');
    const status = $('#upload-status');
    btn.disabled = true;
    status.textContent = 'Uploading...';
    status.classList.remove('hidden');
    try {
      const bucketId = await resolveFilesBucket();
      if (!bucketId) { status.textContent = 'Files bucket not found.'; status.style.color = '#dc3545'; return; }
      const data = await file.arrayBuffer();
      await ez.buckets.objects.put(bucketId, file.name, data, { contentType: file.type || 'application/octet-stream' });
      input.value = '';
      $('#file-name').textContent = 'No file selected';
      status.classList.add('hidden');
      await loadFiles();
    } catch (e) {
      status.textContent = 'Upload failed: ' + e.message;
      status.style.color = '#dc3545';
    } finally {
      btn.disabled = !input.files[0];
    }
  }

  async function downloadFile(key) {
    try {
      const res = await ez.buckets.objects.get(filesBucketId, key);
      const blob = new Blob([res.data], { type: res.contentType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = key;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('Download failed: ' + e.message);
    }
  }

  async function deleteFile(key) {
    const item = document.querySelector(`.file-item[data-key="${key}"]`);
    if (item) item.style.opacity = '0.4';
    try {
      await ez.buckets.objects.delete(filesBucketId, key);
      await loadFiles();
    } catch (e) { alert('Failed to delete: ' + e.message); }
  }

  // ── Boot ──
  boot();

})();
</script>
</body>
</html>
