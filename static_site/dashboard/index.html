<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ezAuth Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4 28 26H4z' fill='%23111'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f6;
  --panel: #ffffff;
  --text: #161616;
  --muted: #5f5f5f;
  --faint: #9a9a9a;
  --border: #e7e7e4;
  --accent: #111111;
  --hover: #f1f1ef;
  --danger: #b3261e;
  --danger-bg: #fdf0ef;
  --ok: #1a7f37;
  --ok-bg: #edf7ef;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px -16px rgba(0,0,0,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
#app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: 250px; background: var(--panel); padding: 24px 16px; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; border-right: 1px solid var(--border); }
.sidebar-brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; padding: 6px 10px 22px; cursor: pointer; color: var(--text); text-decoration: none; }
.brand-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.sidebar a { display: flex; align-items: center; gap: 11px; color: var(--muted); text-decoration: none; padding: 9px 10px; border-radius: 9px; transition: background 0.15s, color 0.15s; cursor: pointer; font-size: 14px; font-weight: 500; }
.sidebar a svg { width: 16px; height: 16px; stroke: currentColor; flex: none; }
.sidebar a:hover { color: var(--text); background: var(--hover); }
.sidebar a.active { color: var(--text); background: var(--hover); font-weight: 600; }
.sidebar .logout { margin-top: auto; border-top: 1px solid var(--border); border-radius: 0; padding-top: 18px; }

/* Content */
.content { margin-left: 250px; padding: 48px 56px; flex: 1; min-width: 0; }
.page-wrap { max-width: 1040px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 32px; }
.page-header h2 { margin-bottom: 0; }
.page-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
h2 { font-size: 26px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.02em; }
h3 { font-size: 12px; font-weight: 600; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

/* Tables — top-level tables render as cards */
#main > table { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; border-collapse: separate; border-spacing: 0; box-shadow: var(--shadow); overflow: hidden; }
table { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
th { text-align: left; padding: 13px 18px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--border); background: #fbfbfa; }
td { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 14px; color: #2b2b2b; }
tr:last-child td { border-bottom: none; }
#main > table tbody tr:hover td { background: #fbfbfa; }

/* Forms */
label { display: block; font-weight: 600; font-size: 11px; margin-bottom: 8px; margin-top: 20px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
label:first-child { margin-top: 0; }
input[type="text"], input[type="email"], input[type="password"], input[type="url"], select, textarea {
  width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; background: var(--panel); color: var(--text); transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,0,0,0.07); }
button, .btn { display: inline-block; padding: 11px 20px; background: var(--accent); color: #fff; border: none; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; transition: opacity 0.15s; letter-spacing: 0.02em; }
button:hover, .btn:hover { opacity: 0.82; }
button:disabled { opacity: 0.45; cursor: default; }
.btn-danger { background: transparent; color: var(--danger); padding: 6px 0; font-weight: 500; }
.btn-danger:hover { opacity: 0.65; background: transparent; }
.btn-sm { padding: 8px 15px; font-size: 12px; }
.pagination .btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
.pagination .btn:hover { background: var(--hover); opacity: 1; }
.pagination .btn:disabled { background: var(--panel); opacity: 0.4; }

/* Cards */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow); }
.stat-card .label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.stat-card .value { font-size: 30px; font-weight: 300; color: var(--text); letter-spacing: -0.02em; }

/* Badges */
.badge { display: inline-block; padding: 3px 10px; font-size: 11px; font-weight: 600; border-radius: 999px; }
.badge-success { color: var(--ok); background: var(--ok-bg); }
.badge-warning { color: #8a6d00; background: #fdf6e0; }
.badge-muted { color: var(--muted); background: var(--hover); }

/* Utility */
.mono { font-family: "SF Mono", Menlo, monospace; font-size: 12.5px; }
.error { color: var(--danger); background: var(--danger-bg); border: 1px solid #f3d4d1; border-radius: 9px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; }
.success { color: var(--ok); font-weight: 600; margin-bottom: 10px; font-size: 14px; }
.inline-form { display: flex; gap: 24px; align-items: flex-end; }
.inline-form input, .inline-form select { margin-bottom: 0; }
.search-form { display: flex; gap: 10px; margin-bottom: 24px; }
.search-form input { max-width: 340px; }
.pagination { display: flex; gap: 16px; align-items: center; margin-top: 24px; justify-content: center; font-size: 13px; color: var(--muted); }
.clickable { cursor: pointer; }
.actions { display: flex; gap: 20px; margin-top: 24px; align-items: center; }
.form-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 24px; box-shadow: var(--shadow); }
.form-card table { margin-bottom: 0; }
.form-card th { background: transparent; padding-top: 8px; }
.back-link { color: var(--muted); cursor: pointer; text-decoration: none; font-size: 13px; font-weight: 500; margin-bottom: 20px; display: inline-block; }
.back-link:hover { color: var(--text); }
.empty { color: var(--faint); padding: 32px 0; font-size: 14px; text-align: center; }
.form-card .empty { text-align: left; padding: 8px 0 16px; }
.provider-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 24px; box-shadow: var(--shadow); }
.provider-card h3 { margin-bottom: 10px; }
.provider-card .badge { margin-bottom: 14px; }
.tag { display: inline-block; background: var(--hover); color: var(--text); padding: 3px 9px; font-size: 11px; font-weight: 500; margin-right: 6px; border-radius: 6px; }
.hidden { display: none; }

/* Resources (overview) */
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.res-link { display: block; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; text-decoration: none; transition: background 0.15s, border-color 0.15s; }
.res-link:hover { background: var(--hover); border-color: #d8d8d4; }
.res-link .res-title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: var(--text); }
.res-link .res-title span:last-child { color: var(--faint); font-weight: 400; }
.res-link .res-desc { font-size: 13px; color: var(--muted); margin-top: 3px; }

/* Login */
.login-page { position: relative; display: flex; align-items: center; justify-content: center; min-height: 100vh; width: 100%; padding: 24px; }
.login-page canvas#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.login-card { position: relative; z-index: 1; background: rgba(255,255,255,0.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 44px 40px; width: 420px; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px -24px rgba(0,0,0,0.25); }
.login-card h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; text-align: center; }
.login-card h1 span { color: var(--faint); font-weight: 300; }
.login-card .login-sub { text-align: center; color: var(--muted); font-size: 14px; margin: 8px 0 28px; }
.login-card .login-hint { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 16px; }
.login-card button { width: 100%; margin-top: 20px; }
.login-card .back-btn { display: block; margin: 14px auto 0; background: transparent; color: var(--muted); padding: 4px 8px; font-weight: 500; }
.login-card .back-btn:hover { color: var(--text); opacity: 1; }

/* Loading */
.spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid #e2e2de; border-top-color: var(--text); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { text-align: center; padding: 80px; color: var(--muted); font-size: 14px; }

@media (max-width: 900px) {
  #app { flex-direction: column; }
  .sidebar { position: sticky; top: 0; width: 100%; height: auto; flex-direction: row; align-items: center; padding: 10px 14px; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; z-index: 10; gap: 4px; }
  .sidebar-brand { padding: 6px 10px; flex: none; }
  .brand-tag { display: none; }
  .nav-group { flex-direction: row; flex: none; }
  .sidebar a { white-space: nowrap; }
  .sidebar .logout { margin-top: 0; margin-left: auto; border-top: none; padding-top: 9px; }
  .content { margin-left: 0; padding: 28px 20px 48px; }
  .inline-form { flex-direction: column; align-items: stretch; gap: 4px; }
  .inline-form button { margin-top: 12px !important; }
  .search-form input { max-width: none; }
}
</style>
</head>
<body>

<div id="app"></div>

<script src="ezauth.iife.js"></script>
<script>
(function() {
  'use strict';

  const $ = (sel, ctx) => (ctx || document).querySelector(sel);
  const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

  let ez = null;
  const apiUrl = 'https://api.ezauth.org';

  const ICONS = {
    overview: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>',
    tables: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12c0 1.66 3.13 3 7 3s7-1.34 7-3"/></svg>',
    buckets: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
    oauth: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8L20 3M15 4.5l3 3M18 2l2.5 2.5"/></svg>',
    logout: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>',
  };

  // ── Session ──

  function getSession() {
    const s = sessionStorage.getItem('ezauth_dash');
    return s ? JSON.parse(s) : null;
  }

  function saveSession(key) {
    sessionStorage.setItem('ezauth_dash', JSON.stringify({ key }));
  }

  function clearSession() {
    sessionStorage.removeItem('ezauth_dash');
    ez = null;
    navigate('');
  }

  function initSDK(key) {
    ez = new EZAuth.EZAuth({ baseUrl: apiUrl, secretKey: key });
  }

  // ── Router ──

  function navigate(hash) {
    window.location.hash = hash;
  }

  function getRoute() {
    const h = window.location.hash.replace(/^#\/?/, '');
    return h || '';
  }

  function router() {
    const session = getSession();
    if (!session) { renderLogin(); return; }
    if (!ez) initSDK(session.key);

    const route = getRoute();
    const parts = route.split('/');

    if (parts[0] === 'users') renderUsers();
    else if (parts[0] === 'tables' && parts[1]) renderTableDetail(parts[1]);
    else if (parts[0] === 'tables') renderTables();
    else if (parts[0] === 'buckets' && parts[1]) renderBucketDetail(parts[1]);
    else if (parts[0] === 'buckets') renderBuckets();
    else if (parts[0] === 'oauth') renderOAuth();
    else renderOverview();
  }

  window.addEventListener('hashchange', router);

  // ── Helpers ──

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function formatBytes(b) {
    if (b == null) return '—';
    if (b === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(b) / Math.log(1024));
    return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + units[i];
  }

  function setActive(name) {
    $$('.sidebar a[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === name));
  }

  // ── Layout ──

  function renderShell(activePage, contentHTML) {
    const app = $('#app');
    app.innerHTML = `
      <nav class="sidebar">
        <a class="sidebar-brand" onclick="location.hash='#overview'">ezAuth<span class="brand-tag">console</span></a>
        <div class="nav-group">
          <a data-nav="overview" onclick="location.hash='#overview'">${ICONS.overview}Overview</a>
          <a data-nav="users" onclick="location.hash='#users'">${ICONS.users}Users</a>
          <a data-nav="tables" onclick="location.hash='#tables'">${ICONS.tables}Tables</a>
          <a data-nav="buckets" onclick="location.hash='#buckets'">${ICONS.buckets}Buckets</a>
          <a data-nav="oauth" onclick="location.hash='#oauth'">${ICONS.oauth}OAuth</a>
        </div>
        <a class="logout" id="logout-btn">${ICONS.logout}Logout</a>
      </nav>
      <main class="content"><div class="page-wrap" id="main">${contentHTML}</div></main>
    `;
    setActive(activePage);
    $('#logout-btn').onclick = clearSession;
  }

  function setContent(html) {
    const m = $('#main');
    if (m) m.innerHTML = html;
  }

  // ── Login ──

  function renderLogin() {
    const app = $('#app');
    app.innerHTML = `
      <div class="login-page">
        <canvas id="bg" aria-hidden="true"></canvas>
        <div class="login-card">
          <h1>ezAuth<span>.</span></h1>
          <p class="login-sub">Sign in to the console with your admin email.</p>
          <p id="login-error" class="error hidden"></p>
          <div id="email-step">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="admin@example.com" autofocus>
            <button id="send-code-btn">Send sign-in code</button>
            <p class="login-hint">We'll email you a one-time code. No password needed.</p>
          </div>
          <div id="code-step" class="hidden">
            <label for="login-code">One-time code</label>
            <input type="text" id="login-code" placeholder="123456" maxlength="6" inputmode="numeric">
            <button id="verify-code-btn">Verify &amp; sign in</button>
            <button class="back-btn" id="back-to-email">&larr; Use a different email</button>
          </div>
        </div>
      </div>
    `;

    $('#send-code-btn').onclick = doSendCode;
    $('#login-email').onkeydown = e => { if (e.key === 'Enter') doSendCode(); };
    $('#verify-code-btn').onclick = doVerifyCode;
    $('#login-code').onkeydown = e => { if (e.key === 'Enter') doVerifyCode(); };
    $('#back-to-email').onclick = () => {
      $('#email-step').classList.remove('hidden');
      $('#code-step').classList.add('hidden');
      $('#login-error').classList.add('hidden');
    };

    const s = document.createElement('script');
    s.src = '/isolife.js';
    document.body.appendChild(s);
  }

  async function doSendCode() {
    const email = $('#login-email').value.trim();
    const errEl = $('#login-error');
    const btn = $('#send-code-btn');
    if (!email) { errEl.textContent = 'Email is required.'; errEl.classList.remove('hidden'); return; }

    btn.disabled = true;
    btn.textContent = 'Sending…';
    errEl.classList.add('hidden');

    try {
      const res = await fetch(apiUrl + '/v1/admin/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || 'Failed: ' + res.status); }
      $('#email-step').classList.add('hidden');
      $('#code-step').classList.remove('hidden');
      $('#login-code').focus();
    } catch (e) {
      errEl.textContent = 'Failed to send code: ' + (e.message || 'Unknown error');
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send sign-in code';
    }
  }

  async function doVerifyCode() {
    const email = $('#login-email').value.trim();
    const code = $('#login-code').value.trim();
    const errEl = $('#login-error');
    const btn = $('#verify-code-btn');
    if (!code) { errEl.textContent = 'Enter the code from your email.'; errEl.classList.remove('hidden'); return; }

    btn.disabled = true;
    btn.textContent = 'Verifying…';
    errEl.classList.add('hidden');

    try {
      const res = await fetch(apiUrl + '/v1/admin/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code }),
      });
      if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.detail || 'Invalid code'); }
      const data = await res.json();
      const entry = Array.isArray(data) ? data[0] : data;
      saveSession(entry.admin_token);
      initSDK(entry.admin_token);
      navigate('#overview');
    } catch (e) {
      errEl.textContent = e.message || 'Verification failed';
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Verify & sign in';
    }
  }

  // ── Overview ──

  function renderOverview() {
    renderShell('overview', '<h2>Overview</h2><div class="loading"><span class="spinner"></span>Loading…</div>');
    loadOverview();
  }

  async function loadOverview() {
    try {
      const [usersRes, tablesRes, bucketsRes] = await Promise.all([
        ez.users.list({ limit: 1 }),
        ez.tables.list(),
        ez.buckets.list(),
      ]);

      let tableStorage = null, objectStorage = null;
      try {
        [tableStorage, objectStorage] = await Promise.all([
          ez.storage.tables(),
          ez.storage.objects(),
        ]);
      } catch(e) { /* storage endpoints may not exist */ }

      const userCount = usersRes.total != null ? usersRes.total : (usersRes.users || []).length;
      const tableCount = (tablesRes.tables || tablesRes || []).length;
      const bucketCount = (bucketsRes.buckets || bucketsRes || []).length;
      const tableBytes = tableStorage ? (tableStorage.used_bytes ?? tableStorage.total_bytes ?? tableStorage.bytes ?? 0) : null;
      const objectBytes = objectStorage ? (objectStorage.used_bytes ?? objectStorage.total_bytes ?? objectStorage.bytes ?? 0) : null;

      setContent(`
        <div class="page-header">
          <div><h2>Overview</h2><p class="page-sub">Your application at a glance.</p></div>
        </div>
        <div class="stat-grid">
          <div class="stat-card"><div class="label">Users</div><div class="value">${userCount}</div></div>
          <div class="stat-card"><div class="label">Tables</div><div class="value">${tableCount}</div></div>
          <div class="stat-card"><div class="label">Buckets</div><div class="value">${bucketCount}</div></div>
          ${tableBytes != null ? `<div class="stat-card"><div class="label">Table Storage</div><div class="value">${formatBytes(tableBytes)}</div></div>` : ''}
          ${objectBytes != null ? `<div class="stat-card"><div class="label">Object Storage</div><div class="value">${formatBytes(objectBytes)}</div></div>` : ''}
        </div>
        <div class="form-card">
          <h3>Resources</h3>
          <div class="res-grid">
            <a class="res-link" href="/docs/">
              <div class="res-title"><span>Documentation</span><span>&rarr;</span></div>
              <div class="res-desc">Guides, flows, and SDK references</div>
            </a>
            <a class="res-link" href="https://api.ezauth.org/docs">
              <div class="res-title"><span>API Explorer</span><span>&rarr;</span></div>
              <div class="res-desc">Interactive REST API reference</div>
            </a>
            <a class="res-link" href="/bots/">
              <div class="res-title"><span>Bot Authentication</span><span>&rarr;</span></div>
              <div class="res-desc">Ed25519 key-pair auth for services</div>
            </a>
          </div>
        </div>
      `);
    } catch(e) {
      setContent(`<h2>Overview</h2><p class="error">Failed to load: ${esc(e.message)}</p>`);
    }
  }

  // ── Users ──

  let usersPage = 0;
  const USERS_LIMIT = 50;

  function renderUsers() {
    renderShell('users', '<h2>Users</h2><div class="loading"><span class="spinner"></span>Loading…</div>');
    usersPage = 0;
    loadUsers();
  }

  async function loadUsers(email) {
    try {
      const params = { limit: USERS_LIMIT, offset: usersPage * USERS_LIMIT };
      if (email) params.email = email;
      const res = await ez.users.list(params);
      const users = res.users || res || [];
      const total = res.total != null ? res.total : '?';

      let html = `
        <div class="page-header">
          <div><h2>Users</h2><p class="page-sub">Everyone signed up to your application.</p></div>
          <button id="create-user-toggle" class="btn btn-sm">Create User</button>
        </div>
        <div id="create-user-form" class="form-card hidden">
          <h3>Create User</h3>
          <p id="create-user-error" class="error hidden"></p>
          <div class="inline-form">
            <div style="flex:1"><label>Email</label><input type="email" id="new-user-email" placeholder="user@example.com"></div>
            <div style="flex:1"><label>Password (optional)</label><input type="password" id="new-user-password" placeholder="Leave blank for magic link only"></div>
            <button id="create-user-btn">Create</button>
          </div>
        </div>
        <div class="search-form">
          <input type="text" id="user-search" placeholder="Search by email…" value="${esc(email || '')}">
          <button id="user-search-btn" class="btn-sm">Search</button>
        </div>
      `;

      if (users.length === 0) {
        html += '<p class="empty">No users found.</p>';
      } else {
        html += `<table><thead><tr><th>Email</th><th>Status</th><th>Created</th></tr></thead><tbody>`;
        for (const u of users) {
          html += `<tr>
            <td>${esc(u.email)}</td>
            <td>${u.email_verified ? '<span class="badge badge-success">Verified</span>' : '<span class="badge badge-muted">Unverified</span>'}</td>
            <td>${formatDate(u.created_at)}</td>
          </tr>`;
        }
        html += '</tbody></table>';
        html += `<div class="pagination">
          <button id="users-prev" class="btn btn-sm" ${usersPage === 0 ? 'disabled' : ''}>Previous</button>
          <span>Page ${usersPage + 1}${total !== '?' ? ' of ' + Math.ceil(total / USERS_LIMIT) : ''}</span>
          <button id="users-next" class="btn btn-sm" ${users.length < USERS_LIMIT ? 'disabled' : ''}>Next</button>
        </div>`;
      }

      setContent(html);
      bindUserEvents(email);
    } catch(e) {
      setContent(`<h2>Users</h2><p class="error">Failed to load: ${esc(e.message)}</p>`);
    }
  }

  function bindUserEvents(currentEmail) {
    const toggle = $('#create-user-toggle');
    const form = $('#create-user-form');
    if (toggle) toggle.onclick = () => form.classList.toggle('hidden');

    const searchBtn = $('#user-search-btn');
    const searchInput = $('#user-search');
    if (searchBtn) {
      const doSearch = () => { usersPage = 0; loadUsers(searchInput.value.trim() || undefined); };
      searchBtn.onclick = doSearch;
      searchInput.onkeydown = e => { if (e.key === 'Enter') doSearch(); };
    }

    const createBtn = $('#create-user-btn');
    if (createBtn) createBtn.onclick = async () => {
      const email = $('#new-user-email').value.trim();
      const password = $('#new-user-password').value;
      const errEl = $('#create-user-error');
      if (!email) { errEl.textContent = 'Email is required.'; errEl.classList.remove('hidden'); return; }
      createBtn.disabled = true;
      try {
        const params = { email };
        if (password) params.password = password;
        await ez.users.create(params);
        loadUsers(currentEmail);
      } catch(e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
        createBtn.disabled = false;
      }
    };

    const prev = $('#users-prev');
    const next = $('#users-next');
    if (prev) prev.onclick = () => { usersPage--; loadUsers(currentEmail); };
    if (next) next.onclick = () => { usersPage++; loadUsers(currentEmail); };
  }

  // ── Tables ──

  function renderTables() {
    renderShell('tables', '<h2>Tables</h2><div class="loading"><span class="spinner"></span>Loading…</div>');
    loadTables();
  }

  async function loadTables() {
    try {
      const res = await ez.tables.list();
      const tables = res.tables || res || [];

      let html = `
        <div class="page-header">
          <div><h2>Tables</h2><p class="page-sub">User-scoped custom tables with typed columns.</p></div>
          <button id="create-table-toggle" class="btn btn-sm">Create Table</button>
        </div>
        <div id="create-table-form" class="form-card hidden">
          <h3>Create Table</h3>
          <p id="create-table-error" class="error hidden"></p>
          <div class="inline-form">
            <div style="flex:1"><label>Name</label><input type="text" id="new-table-name" placeholder="my_table"></div>
            <button id="create-table-btn">Create</button>
          </div>
        </div>
      `;

      if (tables.length === 0) {
        html += '<p class="empty">No tables yet.</p>';
      } else {
        html += '<table><thead><tr><th>Name</th><th>Columns</th><th>Created</th></tr></thead><tbody>';
        for (const t of tables) {
          const cols = t.columns ? t.columns.length : '—';
          html += `<tr class="clickable" data-id="${esc(t.id)}">
            <td><strong>${esc(t.name)}</strong></td>
            <td>${cols}</td>
            <td>${formatDate(t.created_at)}</td>
          </tr>`;
        }
        html += '</tbody></table>';
      }

      setContent(html);

      const toggle = $('#create-table-toggle');
      const form = $('#create-table-form');
      if (toggle) toggle.onclick = () => form.classList.toggle('hidden');

      const createBtn = $('#create-table-btn');
      if (createBtn) createBtn.onclick = async () => {
        const name = $('#new-table-name').value.trim();
        const errEl = $('#create-table-error');
        if (!name) { errEl.textContent = 'Name is required.'; errEl.classList.remove('hidden'); return; }
        createBtn.disabled = true;
        try {
          await ez.tables.create({ name });
          loadTables();
        } catch(e) {
          errEl.textContent = e.message; errEl.classList.remove('hidden');
          createBtn.disabled = false;
        }
      };

      $$('tr.clickable').forEach(tr => {
        tr.onclick = () => navigate('#tables/' + tr.dataset.id);
      });
    } catch(e) {
      setContent(`<h2>Tables</h2><p class="error">Failed to load: ${esc(e.message)}</p>`);
    }
  }

  // ── Table Detail ──

  function renderTableDetail(id) {
    renderShell('tables', '<div class="loading"><span class="spinner"></span>Loading…</div>');
    loadTableDetail(id);
  }

  async function loadTableDetail(id) {
    try {
      const table = await ez.tables.get(id);
      const columns = table.columns || [];

      let html = `
        <a class="back-link" onclick="location.hash='#tables'">&larr; Back to Tables</a>
        <div class="page-header">
          <div><h2>${esc(table.name)}</h2><p class="page-sub">Define columns, then browse the rows stored in this table.</p></div>
        </div>

        <div class="form-card">
          <h3>Columns</h3>
          ${columns.length === 0 ? '<p class="empty">No columns defined.</p>' : `
          <table><thead><tr><th>Name</th><th>Type</th><th>Required</th><th></th></tr></thead><tbody>
            ${columns.map(c => `<tr>
              <td>${esc(c.name)}</td>
              <td><span class="tag">${esc(c.type)}</span></td>
              <td>${c.required ? 'Yes' : 'No'}</td>
              <td style="text-align:right"><button class="btn btn-sm btn-danger delete-col-btn" data-col-id="${esc(c.id)}">Delete</button></td>
            </tr>`).join('')}
          </tbody></table>`}

          <div style="margin-top:24px">
            <h3>Add Column</h3>
            <p id="add-col-error" class="error hidden"></p>
            <div class="inline-form">
              <div style="flex:1"><label>Name</label><input type="text" id="col-name" placeholder="column_name"></div>
              <div style="flex:1"><label>Type</label>
                <select id="col-type">
                  <option value="text">text</option>
                  <option value="integer">integer</option>
                  <option value="float">float</option>
                  <option value="boolean">boolean</option>
                  <option value="json">json</option>
                </select>
              </div>
              <button id="add-col-btn">Add</button>
            </div>
          </div>
        </div>

        <div class="form-card">
          <h3>Rows</h3>
          <div id="rows-container"><div class="loading"><span class="spinner"></span>Loading rows…</div></div>
        </div>
      `;

      setContent(html);
      bindTableDetailEvents(id);
      loadTableRows(id, null);
    } catch(e) {
      setContent(`<a class="back-link" onclick="location.hash='#tables'">&larr; Back</a><p class="error">Failed to load: ${esc(e.message)}</p>`);
    }
  }

  function bindTableDetailEvents(tableId) {
    const addBtn = $('#add-col-btn');
    if (addBtn) addBtn.onclick = async () => {
      const name = $('#col-name').value.trim();
      const type = $('#col-type').value;
      const errEl = $('#add-col-error');
      if (!name) { errEl.textContent = 'Name is required.'; errEl.classList.remove('hidden'); return; }
      addBtn.disabled = true;
      try {
        await ez.tables.columns.add(tableId, { name, type });
        loadTableDetail(tableId);
      } catch(e) {
        errEl.textContent = e.message; errEl.classList.remove('hidden');
        addBtn.disabled = false;
      }
    };

    $$('.delete-col-btn').forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm('Delete this column? This cannot be undone.')) return;
        btn.disabled = true;
        try {
          await ez.tables.columns.delete(tableId, btn.dataset.colId);
          loadTableDetail(tableId);
        } catch(e) { alert('Error: ' + e.message); btn.disabled = false; }
      };
    });
  }

  async function loadTableRows(tableId, cursor) {
    const container = $('#rows-container');
    if (!container) return;
    try {
      const res = await ez.tables.rows.query(tableId, { limit: 25, cursor: cursor || undefined });
      const rows = res.rows || res.data || res || [];
      const nextCursor = res.next_cursor || res.cursor || null;

      if (rows.length === 0 && !cursor) {
        container.innerHTML = '<p class="empty">No rows yet.</p>';
        return;
      }

      // Collect all data keys
      const keys = new Set();
      rows.forEach(r => {
        const data = r.data || r;
        if (typeof data === 'object') Object.keys(data).forEach(k => keys.add(k));
      });
      const cols = [...keys];

      let html = '<div style="overflow-x:auto"><table><thead><tr><th>ID</th>';
      for (const c of cols) html += `<th>${esc(c)}</th>`;
      html += '<th>Created</th></tr></thead><tbody>';
      for (const r of rows) {
        html += `<tr><td class="mono">${esc(String(r.id || ''))}</td>`;
        const data = r.data || r;
        for (const c of cols) {
          const v = data[c];
          html += `<td>${v != null ? esc(String(v)) : '<span style="color:#bbb">null</span>'}</td>`;
        }
        html += `<td>${formatDate(r.created_at)}</td></tr>`;
      }
      html += '</tbody></table></div>';

      html += '<div class="pagination">';
      if (cursor) html += `<button class="btn btn-sm" id="rows-first">First Page</button>`;
      if (nextCursor) html += `<button class="btn btn-sm" id="rows-next">Next Page</button>`;
      html += '</div>';

      container.innerHTML = html;

      const firstBtn = $('#rows-first');
      const nextBtn = $('#rows-next');
      if (firstBtn) firstBtn.onclick = () => loadTableRows(tableId, null);
      if (nextBtn) nextBtn.onclick = () => loadTableRows(tableId, nextCursor);
    } catch(e) {
      container.innerHTML = `<p class="error">Failed to load rows: ${esc(e.message)}</p>`;
    }
  }

  // ── Buckets ──

  function renderBuckets() {
    renderShell('buckets', '<h2>Buckets</h2><div class="loading"><span class="spinner"></span>Loading…</div>');
    loadBuckets();
  }

  async function loadBuckets() {
    try {
      const res = await ez.buckets.list();
      const buckets = res.buckets || res || [];

      let html = `
        <div class="page-header">
          <div><h2>Buckets</h2><p class="page-sub">S3-compatible object storage, isolated per user.</p></div>
          <button id="create-bucket-toggle" class="btn btn-sm">Create Bucket</button>
        </div>
        <div id="create-bucket-form" class="form-card hidden">
          <h3>Create Bucket</h3>
          <p id="create-bucket-error" class="error hidden"></p>
          <div class="inline-form">
            <div style="flex:1"><label>Name</label><input type="text" id="new-bucket-name" placeholder="my-bucket"></div>
            <button id="create-bucket-btn">Create</button>
          </div>
        </div>
      `;

      if (buckets.length === 0) {
        html += '<p class="empty">No buckets yet.</p>';
      } else {
        html += '<table><thead><tr><th>Name</th><th>Created</th></tr></thead><tbody>';
        for (const b of buckets) {
          html += `<tr class="clickable" data-id="${esc(b.id)}">
            <td><strong>${esc(b.name)}</strong></td>
            <td>${formatDate(b.created_at)}</td>
          </tr>`;
        }
        html += '</tbody></table>';
      }

      setContent(html);

      const toggle = $('#create-bucket-toggle');
      const form = $('#create-bucket-form');
      if (toggle) toggle.onclick = () => form.classList.toggle('hidden');

      const createBtn = $('#create-bucket-btn');
      if (createBtn) createBtn.onclick = async () => {
        const name = $('#new-bucket-name').value.trim();
        const errEl = $('#create-bucket-error');
        if (!name) { errEl.textContent = 'Name is required.'; errEl.classList.remove('hidden'); return; }
        createBtn.disabled = true;
        try {
          await ez.buckets.create({ name });
          loadBuckets();
        } catch(e) {
          errEl.textContent = e.message; errEl.classList.remove('hidden');
          createBtn.disabled = false;
        }
      };

      $$('tr.clickable').forEach(tr => {
        tr.onclick = () => navigate('#buckets/' + tr.dataset.id);
      });
    } catch(e) {
      setContent(`<h2>Buckets</h2><p class="error">Failed to load: ${esc(e.message)}</p>`);
    }
  }

  // ── Bucket Detail ──

  function renderBucketDetail(id) {
    renderShell('buckets', '<div class="loading"><span class="spinner"></span>Loading…</div>');
    loadBucketDetail(id);
  }

  async function loadBucketDetail(id) {
    try {
      const bucket = await ez.buckets.get(id);
      let html = `
        <a class="back-link" onclick="location.hash='#buckets'">&larr; Back to Buckets</a>
        <div class="page-header">
          <div><h2>${esc(bucket.name)}</h2><p class="page-sub">Objects stored in this bucket.</p></div>
        </div>
        <div class="form-card">
          <h3>Objects</h3>
          <div id="objects-container"><div class="loading"><span class="spinner"></span>Loading objects…</div></div>
        </div>
      `;
      setContent(html);
      loadBucketObjects(id, null);
    } catch(e) {
      setContent(`<a class="back-link" onclick="location.hash='#buckets'">&larr; Back</a><p class="error">Failed to load: ${esc(e.message)}</p>`);
    }
  }

  async function loadBucketObjects(bucketId, cursor) {
    const container = $('#objects-container');
    if (!container) return;
    try {
      const res = await ez.buckets.objects.list(bucketId, { limit: 25, cursor: cursor || undefined });
      const objects = res.objects || res.data || res || [];
      const nextCursor = res.next_cursor || res.cursor || null;

      if (objects.length === 0 && !cursor) {
        container.innerHTML = '<p class="empty">No objects yet.</p>';
        return;
      }

      let html = '<table><thead><tr><th>Key</th><th>Content Type</th><th>Size</th><th>Created</th></tr></thead><tbody>';
      for (const o of objects) {
        html += `<tr>
          <td class="mono">${esc(o.key)}</td>
          <td>${esc(o.content_type || '—')}</td>
          <td>${formatBytes(o.size)}</td>
          <td>${formatDate(o.created_at)}</td>
        </tr>`;
      }
      html += '</tbody></table>';

      html += '<div class="pagination">';
      if (cursor) html += `<button class="btn btn-sm" id="obj-first">First Page</button>`;
      if (nextCursor) html += `<button class="btn btn-sm" id="obj-next">Next Page</button>`;
      html += '</div>';

      container.innerHTML = html;

      const firstBtn = $('#obj-first');
      const nextBtn = $('#obj-next');
      if (firstBtn) firstBtn.onclick = () => loadBucketObjects(bucketId, null);
      if (nextBtn) nextBtn.onclick = () => loadBucketObjects(bucketId, nextCursor);
    } catch(e) {
      container.innerHTML = `<p class="error">Failed to load objects: ${esc(e.message)}</p>`;
    }
  }

  // ── OAuth ──

  function renderOAuth() {
    renderShell('oauth', '<h2>OAuth Providers</h2><div class="loading"><span class="spinner"></span>Loading…</div>');
    loadOAuth();
  }

  async function loadOAuth() {
    try {
      const session = getSession();
      const res = await fetch(apiUrl + '/v1/oauth/providers', {
        headers: { 'Authorization': 'Bearer ' + session.key }
      });
      if (!res.ok) throw new Error('Failed to fetch providers: ' + res.status);
      const data = await res.json();
      const raw = data.providers || data || {};
      const providers = Array.isArray(raw) ? raw : Object.entries(raw).map(([k, v]) => ({ provider: k, ...v }));

      const configured = {};
      for (const p of providers) {
        configured[p.provider || p.name] = p;
      }

      let html = `
        <div class="page-header">
          <div><h2>OAuth Providers</h2><p class="page-sub">Let users sign in with their existing accounts.</p></div>
        </div>`;

      // Google
      html += renderProviderForm('google', 'Google', configured.google, [
        { key: 'client_id', label: 'Client ID', type: 'text' },
        { key: 'client_secret', label: 'Client Secret', type: 'password' },
      ]);

      // Apple
      html += renderProviderForm('apple', 'Apple', configured.apple, [
        { key: 'client_id', label: 'Client ID (Service ID)', type: 'text' },
        { key: 'team_id', label: 'Team ID', type: 'text' },
        { key: 'key_id', label: 'Key ID', type: 'text' },
        { key: 'private_key', label: 'Private Key', type: 'textarea' },
      ]);

      setContent(html);
      bindOAuthEvents();
    } catch(e) {
      setContent(`<h2>OAuth Providers</h2><p class="error">Failed to load: ${esc(e.message)}</p>`);
    }
  }

  function renderProviderForm(provider, label, existing, fields) {
    let html = `<div class="provider-card">
      <h3>${label}</h3>
      ${existing ? '<span class="badge badge-success">Configured</span>' : '<span class="badge badge-muted">Not configured</span>'}
      <p id="${provider}-msg" class="hidden" style="margin-top:12px"></p>
      <div style="margin-top:8px">`;

    for (const f of fields) {
      const val = existing ? (existing[f.key] || '') : '';
      html += `<label>${f.label}</label>`;
      if (f.type === 'textarea') {
        html += `<textarea id="${provider}-${f.key}" rows="4" placeholder="${f.label}">${esc(val)}</textarea>`;
      } else {
        html += `<input type="${f.type}" id="${provider}-${f.key}" value="${esc(val)}" placeholder="${f.label}">`;
      }
    }

    html += `</div><div class="actions">
      <button class="btn" id="${provider}-save">Save</button>
      ${existing ? `<button class="btn btn-danger" id="${provider}-delete">Remove configuration</button>` : ''}
    </div></div>`;
    return html;
  }

  function bindOAuthEvents() {
    bindProviderSave('google', ['client_id', 'client_secret']);
    bindProviderSave('apple', ['client_id', 'team_id', 'key_id', 'private_key']);
    bindProviderDelete('google');
    bindProviderDelete('apple');
  }

  function bindProviderSave(provider, fields) {
    const btn = $(`#${provider}-save`);
    if (!btn) return;
    btn.onclick = async () => {
      const msgEl = $(`#${provider}-msg`);
      const body = {};
      for (const f of fields) {
        const el = $(`#${provider}-${f}`);
        body[f] = el ? el.value.trim() : '';
      }
      btn.disabled = true;
      msgEl.classList.add('hidden');
      try {
        const session = getSession();
        const res = await fetch(apiUrl + '/v1/oauth/providers/' + provider, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + session.key, 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || d.message || 'Failed: ' + res.status); }
        msgEl.textContent = 'Saved successfully.';
        msgEl.className = 'success';
        msgEl.classList.remove('hidden');
        setTimeout(() => loadOAuth(), 1000);
      } catch(e) {
        msgEl.textContent = e.message;
        msgEl.className = 'error';
        msgEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    };
  }

  function bindProviderDelete(provider) {
    const btn = $(`#${provider}-delete`);
    if (!btn) return;
    btn.onclick = async () => {
      if (!confirm(`Remove ${provider} OAuth configuration?`)) return;
      btn.disabled = true;
      try {
        const session = getSession();
        const res = await fetch(apiUrl + '/v1/oauth/providers/' + provider, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + session.key },
        });
        if (!res.ok) throw new Error('Failed: ' + res.status);
        loadOAuth();
      } catch(e) {
        alert('Error: ' + e.message);
        btn.disabled = false;
      }
    };
  }

  // ── Boot ──

  router();

})();
</script>
</body>
</html>
