<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — ezAuth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/dashboard/static/dashboard.css">
</head>
<body class="login-page">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="login-card">
        <h1>ezauth<span style="color:var(--faint)">.org</span></h1>
        <p class="login-sub">Sign in to the dashboard with your owner email.</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/dashboard/login">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus autocomplete="email">
            <button type="submit">Send code</button>
        </form>
    </div>
    {% include "_lattice.html" %}
</body>
</html>
