{% extends "layout.html" %}
{% block title %}Email templates — ezAuth{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h2>Email templates</h2>
        <p class="sub">Instance-wide Mustache templates used for every application's emails.</p>
    </div>
</div>
<ul class="template-list">
    {% for name in template_files %}
    <li><a href="/dashboard/email-templates/{{ name }}">{{ name }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
