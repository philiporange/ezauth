{% extends "layout.html" %}
{% block title %}Set Password{% endblock %}
{% block header_subtitle %}<p>Choose a new password</p>{% endblock %}
{% block content %}
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

    <p class="auth-description">Setting a new password signs you out everywhere else.</p>

    <form method="post" action="/auth/set-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="redirect_url" value="{{ redirect_url or '' }}">

        <label for="password">New password</label>
        <input type="password" id="password" name="password" required autofocus
               minlength="8" autocomplete="new-password">

        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required
               minlength="8" autocomplete="new-password">

        <button type="submit" class="btn btn-primary">Set Password</button>
    </form>
{% endblock %}
